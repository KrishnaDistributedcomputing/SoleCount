# SoleCount Xcode project, generated by XcodeGen.
# Run `xcodegen generate` (scripts/setup_mac.sh does it for you).
# The .xcodeproj is NOT committed: this file is the single source of truth.
name: SoleCount

options:
  bundleIdPrefix: com.krishnav
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"        # the version people see in the App Store
    CURRENT_PROJECT_VERSION: "1"    # build number; fastlane bumps it automatically
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: YES

fileGroups:
  - SoleCount.storekit
  - project.yml

targets:
  SoleCount:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: SoleCount
        excludes:
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishnav.SoleCount
        PRODUCT_NAME: SoleCount
        INFOPLIST_KEY_CFBundleDisplayName: SoleCount
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        # Debug stays unsigned-friendly for the simulator tests (no Team ID).
        # Release carries HealthKit and the widget App Group for a real phone.
        Release:
          CODE_SIGN_ENTITLEMENTS: SoleCount/SoleCount.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - target: SoleCountWidget
        embed: true
    info:
      path: SoleCount/Info.plist
      properties:
        CFBundleDisplayName: SoleCount
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question
        NSHealthShareUsageDescription: SoleCount reads your steps and walking distance to show how far you've walked in each pair of shoes.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.HealthKit:
          enabled: 1

  SoleCountWidget:
    type: app-extension
    supportedDestinations: [iOS]
    deploymentTarget: "18.0"
    sources:
      - path: SoleCountWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: SoleCountWidget/Info.plist
      properties:
        CFBundleDisplayName: SoleCount
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishnav.SoleCount.widget
        PRODUCT_NAME: SoleCountWidget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: SoleCountWidget/SoleCountWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SoleCountTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: SoleCountTests
      - path: SoleCount/ReleaseManifest.json
        buildPhase: resources
    dependencies:
      - target: SoleCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishnav.SoleCountTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SoleCount.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SoleCount
        BUNDLE_LOADER: $(TEST_HOST)

  SoleCountUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: SoleCountUITests
    dependencies:
      - target: SoleCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishnav.SoleCountUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SoleCount

schemes:
  SoleCount:
    build:
      targets:
        SoleCount: all
        SoleCountWidget: all
        SoleCountTests: [test]
        SoleCountUITests: [test]
    run:
      config: Debug
      # Lets you test the $0.99 purchase in the Simulator with no App Store account.
      storeKitConfiguration: SoleCount.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [SoleCount]
      targets:
        - SoleCountTests
        - SoleCountUITests
    profile:
      config: Release
    archive:
      config: Release
